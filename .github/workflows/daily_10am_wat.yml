name: Daily WAT Clip Drop & Dashboard (4-Window Fallback)

on:
  schedule:
    # 4 staggered daily WAT fallback windows (UTC+1):
    # - 08:37 UTC = 09:37 WAT (Primary)
    # - 11:17 UTC = 12:17 WAT (Backup 1)
    # - 14:43 UTC = 15:43 WAT (Backup 2)
    # - 18:19 UTC = 19:19 WAT (Backup 3)
    # If today's drop already succeeded in an earlier window, the idempotency gate skips duplicate sends.
    - cron: "37 8 * * *"
    - cron: "17 11 * * *"
    - cron: "43 14 * * *"
    - cron: "19 18 * * *"
  workflow_dispatch:
    inputs:
      clip_count:
        description: "How many punchy clips to produce and send to Telegram today (default: 3)"
        required: false
        default: "3"
      target_sec:
        description: "Target clip duration in seconds (default: 18, or 'auto' for AI-optimized length)"
        required: false
        default: "18"
      niche:
        description: "Content niche: gta6 (strict GTA 6) or gaming (broader gaming/campaign clips)"
        required: false
        type: choice
        options:
          - gta6
          - gaming
        default: "gta6"
      force_drop:
        description: "Send clips even if today's WAT drop already ran"
        type: boolean
        required: false
        default: false
      dry_run:
        description: "Validate without sending to Telegram or mutating state"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "gta6-daily-pipeline"
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install ffmpeg, DejaVu bold font, and Python packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install --quiet -r requirements.txt

      - name: Run Daily WAT Pipeline (Idempotent Multi-Window)
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCRAPE_CREATORS_API_KEY: ${{ secrets.SCRAPE_CREATORS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'nvidia/nemotron-3.5-super-vl:free' }}
          WHISPER_BACKEND: ${{ vars.WHISPER_BACKEND || 'auto' }}
          PAGE_NAME: ${{ vars.PAGE_NAME || 'Leonida Chaos' }}
          TWITCH_STREAMERS: ${{ vars.TWITCH_STREAMERS }}
          EXTRA_SCOUT_QUERIES: ${{ vars.EXTRA_SCOUT_QUERIES }}
          REQUIRE_GTA6_ONLY: ${{ vars.REQUIRE_GTA6_ONLY || 'true' }}
          REQUIRE_FACECAM: ${{ vars.REQUIRE_FACECAM || 'true' }}
          MIN_VIRALITY_SCORE: ${{ vars.MIN_VIRALITY_SCORE }}
          CONTENT_NICHE: ${{ inputs.niche || vars.CONTENT_NICHE || 'gta6' }}
          ACTIVE_CAMPAIGN_ID: ${{ vars.ACTIVE_CAMPAIGN_ID }}
          YT_CHANNEL_URL: ${{ vars.YT_CHANNEL_URL }}
          TIKTOK_HANDLE: ${{ vars.TIKTOK_HANDLE }}
          IG_HANDLE: ${{ vars.IG_HANDLE }}
          DAILY_CLIP_COUNT: ${{ inputs.clip_count || vars.DAILY_CLIP_COUNT || '3' }}
          TARGET_CLIP_SEC: ${{ inputs.target_sec || vars.TARGET_CLIP_SEC || '18' }}
        run: |
          SLOT_LABEL="Manual Dispatch"
          case "${{ github.event.schedule }}" in
            "37 8 * * *") SLOT_LABEL="09:37 WAT (Primary)" ;;
            "17 11 * * *") SLOT_LABEL="12:17 WAT (Backup 1)" ;;
            "43 14 * * *") SLOT_LABEL="15:43 WAT (Backup 2)" ;;
            "19 18 * * *") SLOT_LABEL="19:19 WAT (Backup 3)" ;;
          esac
          ARGS="--clip-count ${DAILY_CLIP_COUNT} --target-sec ${TARGET_CLIP_SEC} --niche ${CONTENT_NICHE}"
          if [ "${{ inputs.force_drop }}" = "true" ]; then
            ARGS="$ARGS --force-drop"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python3 scripts/daily_cloud_pipeline.py $ARGS --slot-label "$SLOT_LABEL"

      - name: Commit updated tracking files & live dashboard
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "gta6-clip-ceo[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add scoreboard.csv log.md learning.md dashboard/index.html data/ proofs/ clips/ 2>/dev/null || git add scoreboard.csv log.md learning.md dashboard/index.html data/ proofs/
          if ! git diff --cached --quiet; then
            git commit -m "chore: daily WAT clip drop & dashboard refresh"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break || sleep 3
            done
          fi

      - name: Upload live dashboard artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

  deploy-dashboard:
    needs: run-pipeline
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy dashboard to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
