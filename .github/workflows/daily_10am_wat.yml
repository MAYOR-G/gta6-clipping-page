name: Daily 10 AM WAT GTA 6 Clip Drop & Dashboard

on:
  schedule:
    # 08:37 UTC = 09:37 AM WAT (off-peak minute avoids GitHub's :00 rush-hour cron delay so clips land ~10:00 AM WAT)
    - cron: "37 8 * * *"
  workflow_dispatch:
    inputs:
      clip_count:
        description: "How many punchy ~18s clips to produce and send to Telegram today (5 different streamers)"
        required: false
        default: "5"
      target_sec:
        description: "Target clip duration in seconds (default: 18, or 'auto' for AI-optimized length)"
        required: false
        default: "18"
      dry_run:
        description: "Validate without sending to Telegram or mutating state"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "gta6-daily-pipeline"
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg, DejaVu bold font, and Python packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install --quiet -r requirements.txt

      - name: Run Daily 10 AM WAT Pipeline
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCRAPE_CREATORS_API_KEY: ${{ secrets.SCRAPE_CREATORS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'nvidia/nemotron-3.5-super-vl:free' }}
          PAGE_NAME: ${{ vars.PAGE_NAME || 'Leonida Chaos' }}
          TWITCH_STREAMERS: ${{ vars.TWITCH_STREAMERS }}
          EXTRA_SCOUT_QUERIES: ${{ vars.EXTRA_SCOUT_QUERIES }}
          REQUIRE_GTA6_ONLY: ${{ vars.REQUIRE_GTA6_ONLY || 'true' }}
          REQUIRE_FACECAM: ${{ vars.REQUIRE_FACECAM || 'true' }}
          MIN_VIRALITY_SCORE: ${{ vars.MIN_VIRALITY_SCORE }}
          YT_CHANNEL_URL: ${{ vars.YT_CHANNEL_URL }}
          TIKTOK_HANDLE: ${{ vars.TIKTOK_HANDLE }}
          IG_HANDLE: ${{ vars.IG_HANDLE }}
          DAILY_CLIP_COUNT: ${{ inputs.clip_count || vars.DAILY_CLIP_COUNT || '5' }}
          TARGET_CLIP_SEC: ${{ inputs.target_sec || vars.TARGET_CLIP_SEC || '18' }}
        run: |
          ARGS="--clip-count ${DAILY_CLIP_COUNT} --target-sec ${TARGET_CLIP_SEC}"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python3 scripts/daily_cloud_pipeline.py $ARGS

      - name: Commit updated tracking files & live dashboard
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "gta6-clip-ceo[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add scoreboard.csv log.md learning.md dashboard/index.html data/ proofs/
          git diff --cached --quiet || git commit -m "chore: daily 10 AM WAT clip drop & dashboard refresh"
          git push

      - name: Upload live dashboard artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

  deploy-dashboard:
    needs: run-pipeline
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy dashboard to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
